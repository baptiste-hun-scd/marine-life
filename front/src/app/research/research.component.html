<h1>Vie marine</h1>

<form class="filters glob-card" role="search">
  <label for="species-search">Rechercher une espèce</label>
  <input
    id="species-search"
    name="species-search"
    type="search"
    autocomplete="off"
    [value]="query()"
    (input)="onQueryInput($event)"
  />

  <app-multi-select-autocomplete
    inputId="filter-embranchement"
    label="Embranchement"
    placeholder="Rechercher un embranchement…"
    [options]="embranchements()"
    [selectedIds]="selectedEmbranchementIds()"
    (selectedIdsChange)="onEmbranchementChange($event)"
  />

  <app-multi-select-autocomplete
    inputId="filter-classe"
    label="Classe"
    placeholder="Rechercher une classe…"
    [options]="classes()"
    [selectedIds]="selectedClasseIds()"
    (selectedIdsChange)="onClasseChange($event)"
  />

  <app-multi-select-autocomplete
    inputId="filter-ordre"
    label="Ordre"
    placeholder="Rechercher un ordre…"
    [options]="ordres()"
    [selectedIds]="selectedOrdreIds()"
    (selectedIdsChange)="onOrdreChange($event)"
  />

  <button type="button" class="glob-button glob-button--secondary" [disabled]="!hasActiveFilters()" (click)="onReset()">
    Réinitialiser
  </button>
</form>

@if (hasActiveFilters()) {
  <app-species-results-section
    headingId="search-results-heading"
    heading="Résultats de la recherche"
    [speciesList]="results.value()"
    [isLoading]="results.isLoading()"
    [hasError]="!!results.error()"
    loadingMessage="Recherche en cours…"
    errorMessage="Une erreur est survenue pendant la recherche."
    emptyMessage="Aucune espèce ne correspond à ces critères."
  />
} @else {
  <app-species-results-section
    headingId="latest-species-heading"
    heading="Derniers ajouts"
    [speciesList]="latestSpecies.value()"
    [isLoading]="latestSpecies.isLoading()"
    [hasError]="!!latestSpecies.error()"
    loadingMessage="Chargement des derniers ajouts…"
    errorMessage="Impossible de charger les derniers ajouts."
    emptyMessage="Aucun ajout récent."
  />
}
