name: Deploy back

on:
  push:
    branches: [main]
    paths:
      - back/**
      - .github/workflows/deploy-back.yml
  workflow_dispatch:

concurrency:
  group: deploy-back
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    environment: prod
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish backend
        run: dotnet publish back/src/MarineLife.Api -c Release -o publish/back

      - name: Replace secrets in appsettings.Production.json
        run: |
          front_url='${{ secrets.FRONT_URL }}'
          [ -n "$front_url" ] || { echo "Secret FRONT_URL is not set." >&2; exit 1; }

          file=publish/back/appsettings.Production.json
          content=$(<"$file")
          printf '%s\n' "${content//__FRONT_URL__/"$front_url"}" > "$file"
          if grep -q '__FRONT_URL__' "$file"; then echo "Unreplaced token left in $file." >&2; exit 1; fi

      - name: Deploy backend
        run: |
          site='${{ secrets.IIS_BACK_SITE_NAME }}'
          deploy_path='${{ secrets.IIS_BACK_DEPLOY_PATH }}'
          if [ -z "$site" ] || [ -z "$deploy_path" ]; then
            echo "Secrets IIS_BACK_SITE_NAME and IIS_BACK_DEPLOY_PATH must be set." >&2; exit 1
          fi

          export MSYS_NO_PATHCONV=1
          appcmd="$WINDIR/System32/inetsrv/appcmd.exe"
          bs='\'
          norm() { local p; p=$(cygpath -w -a "$1"); p=${p,,}; while [[ "$p" == *"$bs" ]]; do p=${p%"$bs"}; done; printf '%s' "$p"; }

          "$appcmd" list site "$site" > /dev/null || { echo "IIS site '$site' not found." >&2; exit 1; }

          source=$(cygpath -w -a publish/back)
          target=$(cygpath -w -a "$deploy_path")
          if [[ "$(norm "$deploy_path")" =~ ^[a-z]:$ ]]; then echo "Refusing to deploy to a drive root." >&2; exit 1; fi

          site_path=$("$appcmd" list vdir "$site/" /text:physicalPath | tr -d '\r')
          if [ "$(norm "$site_path")" != "$(norm "$deploy_path")" ]; then
            echo "IIS site '$site' points to '$site_path', not to '$target'." >&2; exit 1
          fi

          mkdir -p "$(cygpath -u "$target")"
          offline="$(cygpath -u "$target")/app_offline.htm"
          echo '<html><body><h1>Mise a jour en cours</h1></body></html>' > "$offline"
          sleep 5

          code=0
          robocopy "$source" "$target" /MIR /XF app_offline.htm /NFL /NDL /NP /R:5 /W:3 || code=$?
          if [ "$code" -ge 8 ]; then echo "robocopy failed (exit code $code); app_offline.htm left in place." >&2; exit 1; fi
          rm -f "$offline"

          state=$("$appcmd" list site "$site" /text:state | tr -d '\r')
          [ "$state" = "Started" ] || "$appcmd" start site "$site"

          echo "Deployment completed successfully!"
