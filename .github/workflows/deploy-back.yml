name: Deploy back

on:
  push:
    branches: [main]
    paths:
      - back/**
      - .github/workflows/deploy-back.yml
  workflow_dispatch:

concurrency:
  group: deploy-back
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      FRONT_URL: ${{ vars.FRONT_URL }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check variables
        run: |
          [ -n "$FRONT_URL" ] || { echo "Repository variable FRONT_URL is not set." >&2; exit 1; }

      - name: Publish
        run: dotnet publish back/src/MarineLife.Api -c Release -o publish

      - name: Set allowed CORS origin
        run: |
          file=publish/appsettings.Production.json
          content=$(<"$file")
          printf '%s\n' "${content//__FRONT_URL__/"$FRONT_URL"}" > "$file"
          if grep -q '__FRONT_URL__' "$file"; then echo "Unreplaced token left in $file." >&2; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: back
          path: publish
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: [self-hosted, windows, iis]
    environment: production
    env:
      IIS_SITE_NAME: ${{ vars.IIS_BACK_SITE_NAME }}
      IIS_DEPLOY_PATH: ${{ vars.IIS_BACK_DEPLOY_PATH }}
      SOURCE_PATH: ${{ runner.temp }}\back
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: back
          path: ${{ runner.temp }}/back

      - name: Deploy to IIS
        run: |
          export MSYS_NO_PATHCONV=1
          appcmd="$WINDIR/System32/inetsrv/appcmd.exe"
          bs='\'
          norm() { local p; p=$(cygpath -w -a "$1"); p=${p,,}; while [[ "$p" == *"$bs" ]]; do p=${p%"$bs"}; done; printf '%s' "$p"; }

          if [ -z "$IIS_SITE_NAME" ] || [ -z "$IIS_DEPLOY_PATH" ]; then
            echo "Repository variables IIS_BACK_SITE_NAME and IIS_BACK_DEPLOY_PATH must be set." >&2; exit 1
          fi
          "$appcmd" list site "$IIS_SITE_NAME" > /dev/null || { echo "IIS site '$IIS_SITE_NAME' not found." >&2; exit 1; }

          target=$(cygpath -w -a "$IIS_DEPLOY_PATH")
          if [[ "$(norm "$IIS_DEPLOY_PATH")" =~ ^[a-z]:$ ]]; then echo "Refusing to deploy to a drive root." >&2; exit 1; fi

          site_path=$("$appcmd" list vdir "$IIS_SITE_NAME/" /text:physicalPath | tr -d '\r')
          if [ "$(norm "$site_path")" != "$(norm "$IIS_DEPLOY_PATH")" ]; then
            echo "IIS site '$IIS_SITE_NAME' points to '$site_path', not to '$target'." >&2; exit 1
          fi

          mkdir -p "$(cygpath -u "$target")"
          offline="$(cygpath -u "$target")/app_offline.htm"
          echo '<html><body><h1>Mise a jour en cours</h1></body></html>' > "$offline"
          sleep 3

          code=0
          robocopy "$SOURCE_PATH" "$target" /MIR /XF app_offline.htm /NFL /NDL /NP /R:5 /W:3 || code=$?
          if [ "$code" -ge 8 ]; then echo "robocopy failed (exit code $code); app_offline.htm left in place." >&2; exit 1; fi
          rm -f "$offline"

          state=$("$appcmd" list site "$IIS_SITE_NAME" /text:state | tr -d '\r')
          [ "$state" = "Started" ] || "$appcmd" start site "$IIS_SITE_NAME"
