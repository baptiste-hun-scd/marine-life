name: Deploy front

on:
  push:
    branches: [main]
    paths:
      - front/**
      - .github/workflows/deploy-front.yml
  workflow_dispatch:

concurrency:
  group: deploy-front
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    environment: prod
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Replace secrets in environment.ts
        run: |
          api_url='${{ secrets.API_URL }}'
          [ -n "$api_url" ] || { echo "Secret API_URL is not set." >&2; exit 1; }

          file=front/src/environments/environment.ts
          content=$(<"$file")
          printf '%s\n' "${content//__API_URL__/"$api_url"}" > "$file"
          if grep -q '__API_URL__' "$file"; then echo "Unreplaced token left in $file." >&2; exit 1; fi

      - name: Install packages
        run: |
          cd front
          npm ci

      - name: Run tests
        run: |
          cd front
          npx ng test --watch=false

      - name: Build Angular app
        run: |
          cd front
          npx ng build --configuration production

      - name: Deploy frontend
        run: |
          site='${{ secrets.IIS_FRONT_SITE_NAME }}'
          deploy_path='${{ secrets.IIS_FRONT_DEPLOY_PATH }}'
          if [ -z "$site" ] || [ -z "$deploy_path" ]; then
            echo "Secrets IIS_FRONT_SITE_NAME and IIS_FRONT_DEPLOY_PATH must be set." >&2; exit 1
          fi

          export MSYS_NO_PATHCONV=1
          appcmd="$WINDIR/System32/inetsrv/appcmd.exe"
          bs='\'
          norm() { local p; p=$(cygpath -w -a "$1"); p=${p,,}; while [[ "$p" == *"$bs" ]]; do p=${p%"$bs"}; done; printf '%s' "$p"; }

          "$appcmd" list site "$site" > /dev/null || { echo "IIS site '$site' not found." >&2; exit 1; }

          source=$(cygpath -w -a front/dist/marine-life/browser)
          target=$(cygpath -w -a "$deploy_path")
          if [[ "$(norm "$deploy_path")" =~ ^[a-z]:$ ]]; then echo "Refusing to deploy to a drive root." >&2; exit 1; fi

          site_path=$("$appcmd" list vdir "$site/" /text:physicalPath | tr -d '\r')
          if [ "$(norm "$site_path")" != "$(norm "$deploy_path")" ]; then
            echo "IIS site '$site' points to '$site_path', not to '$target'." >&2; exit 1
          fi

          mkdir -p "$(cygpath -u "$target")"

          code=0
          robocopy "$source" "$target" /MIR /NFL /NDL /NP /R:5 /W:3 || code=$?
          if [ "$code" -ge 8 ]; then echo "robocopy failed (exit code $code)." >&2; exit 1; fi

          state=$("$appcmd" list site "$site" /text:state | tr -d '\r')
          [ "$state" = "Started" ] || "$appcmd" start site "$site"

          echo "Deployment completed successfully!"
